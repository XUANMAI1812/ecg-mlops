# Kiểm tra tự động cho mọi Pull Request vào main và mọi lần push lên main:
# code style (ruff) và toàn bộ test (pytest). Test dùng dữ liệu giả lập,
# không cần dữ liệu PTB-XL. Mô tả chi tiết: docs/setup.md mục 16.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Push mới lên cùng một nhánh/PR thì huỷ lần chạy cũ đang dở.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
  MLFLOW_DISABLE_TELEMETRY: "true"
  DO_NOT_TRACK: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cài Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      # Cài torch bản CPU trước (giống docker/Dockerfile.train), sau đó
      # requirements/dev.txt giữ nguyên bản +cpu, không tải bản CUDA từ PyPI.
      - name: Cài thư viện
        run: |
          TORCH_VERSION="$(grep -E '^torch==' requirements/dev.txt | cut -d= -f3)"
          python -m pip install "torch==${TORCH_VERSION}" --index-url "${TORCH_INDEX_URL}"
          python -m pip install -r requirements/dev.txt
          python -m pip check
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"

      - name: Kiểm tra code style (ruff check)
        run: ruff check src tests scripts flows

      - name: Kiểm tra định dạng (ruff format)
        run: ruff format --check src tests scripts flows

      - name: Chạy test (pytest)
        env:
          PYTHONPATH: src
        run: pytest -q
